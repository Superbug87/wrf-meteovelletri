name: Verifica giornaliera

# Ogni mattina confronta le previsioni del giorno prima con le osservazioni (Regione Lazio, Aeronautica, radar della
# Protezione Civile) e aggiorna la pagella nel ramo "verifica". Pochi minuti, niente WRF.
on:
  workflow_dispatch:
    inputs:
      giorno:
        description: "Giorno da verificare AAAA-MM-GG (vuoto = ieri)"
        required: false
        default: ""

permissions:
  contents: write                 # serve a pubblicare nel ramo "verifica"

concurrency:
  group: verifica
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Librerie
        run: pip install -q numpy scipy requests netCDF4 pyproj tifffile imagecodecs
      - name: Verifica e pagella
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIORNO: ${{ github.event.inputs.giorno }}
        run: bash strumenti/verifica.sh ${GIORNO:+"$GIORNO"}
