name: "PROVE · tutte le prove (dal regista o a mano)"
run-name: "PROVA ${{ inputs.zona }} ${{ inputs.pilota }} ${{ inputs.nudging }}${{ inputs.fisica && format(' {0}', inputs.fisica) || '' }}${{ inputs.runner != 'ubuntu-22.04-arm' && format(' {0}', inputs.runner) || '' }} ${{ inputs.ciclo }}"

# Un run di WRF per provare una scelta prima di metterla nei lanci normali: NON pubblica le mappe (restano negli allegati del
# run per 14 giorni). Le prove di fisica (campo "fisica") non fanno nemmeno le mappe: lasciano l'estratto per la verifica
# nel ramo prove-fisica, e la pagella le mette a confronto con i run normali. Si possono lanciare piu' prove insieme, anche sullo stesso ciclo:
# ogni combinazione zona/modello/fonti ha la sua coda e non disturba i quattro workflow normali.
on:
  workflow_dispatch:
    inputs:
      zona:
        type: choice
        options: [castelli, lazio, lazio3]
        default: castelli
      pilota:
        type: choice
        options: [ecmwf, icon2i, iconeu, gfs]
        default: ecmwf
      ciclo:
        description: "Ciclo AAAAMMGGHH (vuoto = l'ultimo disponibile)"
        default: ""
      ore:
        description: "Ore di previsione"
        default: "48"
      nudging:
        description: "Stazioni per il nudging"
        type: choice
        options: [wu, ufficiali, tutte, nessuno]
        default: ufficiali
      controllo:
        description: "Tieni fuori dal nudging un quarto delle stazioni della Regione (per misurare l'effetto)"
        type: boolean
        default: true
      runner:
        description: "Macchina di GitHub: ubuntu-22.04-arm (ARM, quella in uso) o ubuntu-22.04 (x86, per confronto)"
        default: "ubuntu-22.04-arm"
      fisica:
        description: "Fisica diversa da quella in uso: topo2, mynn, noahmp, mynn-noahmp, radt6 o radt15 (solo Castelli; vuoto = quella in uso)"
        default: ""

permissions:
  contents: write                 # le prove di fisica pubblicano l'estratto nel ramo prove-fisica

concurrency:
  group: sperimentale-${{ inputs.zona }}-${{ inputs.pilota }}-${{ inputs.nudging }}-${{ inputs.fisica }}-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  wrf:
    uses: ./.github/workflows/previsione.yml
    with:
      zona: ${{ inputs.zona }}
      pilota: ${{ inputs.pilota }}
      runner: ${{ inputs.runner }}
      ciclo: ${{ inputs.ciclo }}
      ore: ${{ inputs.ore }}
      stazioni: ${{ inputs.nudging != 'nessuno' }}
      nudging: ${{ inputs.nudging != 'nessuno' && inputs.nudging || 'wu' }}
      controllo: ${{ inputs.controllo }}
      prova: true
      fisica: ${{ inputs.fisica }}
      mare: true
      radar: false
    secrets: inherit
