name: Regista (lancia i run a orario)

# I lanci programmati di GitHub, nei repository nuovi, arrivano con ore di ritardo o non arrivano: questo workflow li
# sostituisce. Lo svegliano da fuori, a orario, attivita' programmate di Claude (gh workflow run regista.yml; orari nel
# README); strumenti/regista.py guarda cosa e' in ritardo e lo lancia. Ogni sveglia dura pochi secondi.
# L'orario qui sotto e' solo una riserva, se GitHub lo rispetta.
on:
  workflow_dispatch:
    inputs:
      prova:
        description: "Dice solo cosa lancerebbe"
        type: boolean
        default: false
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write                 # scrive lanciate.txt e stato.json nel ramo regista
  actions: write                  # serve a lanciare gli altri workflow (workflow_dispatch funziona anche con GITHUB_TOKEN)

concurrency:
  group: regista
  cancel-in-progress: false

jobs:
  regista:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: strumenti
      - name: Cosa c'e' da lanciare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVA: ${{ inputs.prova && '1' || '' }}
        run: |
          if [ -n "$PROVA" ]; then python3 strumenti/regista.py --prova; else python3 strumenti/regista.py; fi
