name: Prova ritaglio MeteoHub
# Solo una verifica (punto 4 dell'analisi del 26/10/2026): MeteoHub ritaglia ICON-2I sul server? Non tocca i run.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meteohub-prova
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests numpy eccodes
      - name: Prova
        env:
          MH_EMAIL: ${{ secrets.MH_EMAIL }}
          MH_PASSWORD: ${{ secrets.MH_PASSWORD }}
        run: python3 strumenti/prova_ritaglio_meteohub.py
