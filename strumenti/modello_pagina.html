<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previsioni WRF Lazio</title>
<style>
  :root {
    --sfondo: #f3f2ee; --carta: #ffffff; --testo: #14130f; --sec: #5d5b54; --linea: #d8d6cc;
    --acc: #2a78d6; --acc-testo: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="chiaro"]) {
      --sfondo: #141412; --carta: #1f1f1c; --testo: #f1f0ea; --sec: #a9a79d; --linea: #3a3a35; --acc: #5b9cf0; --acc-testo: #0b0b0b;
    }
  }
  :root[data-tema="scuro"] {
    --sfondo: #141412; --carta: #1f1f1c; --testo: #f1f0ea; --sec: #a9a79d; --linea: #3a3a35; --acc: #5b9cf0; --acc-testo: #0b0b0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--sfondo); color: var(--testo); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 24px; }
  h1 { font-size: 1.1rem; margin: 4px 0 10px; }
  .righe { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
  .righe button { flex: none; }
  button { font: inherit; color: var(--testo); background: var(--carta); border: 1px solid var(--linea); border-radius: 999px;
           padding: 8px 14px; min-height: 40px; cursor: pointer; }
  button[aria-pressed="true"], button.attivo { background: var(--acc); color: var(--acc-testo); border-color: var(--acc); font-weight: 600; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
  .quadro { margin: 10px 0; background: var(--carta); border: 1px solid var(--linea); border-radius: 12px; overflow: hidden;
            touch-action: pan-y; position: relative; }
  .quadro img { display: block; width: 100%; height: auto; aspect-ratio: 600 / 770; background: var(--carta); }
  .quadro .msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--sec); }
  .comandi { display: flex; align-items: center; gap: 8px; }
  .comandi input[type=range] { flex: 1; min-width: 0; height: 40px; accent-color: var(--acc); }
  .comandi button { width: 44px; padding: 0; font-size: 1.1rem; }
  .scarica { display: flex; gap: 8px; margin: 0 0 10px; }
  .scarica button { flex: 1; border-radius: 10px; font-size: .95rem; }
  button:disabled { opacity: .6; cursor: progress; }
  .ora { display: flex; justify-content: space-between; margin: 6px 2px 10px; color: var(--sec); font-size: .9rem; font-variant-numeric: tabular-nums; }
  .ora b { color: var(--testo); }
  .run[hidden] { display: none; }
  .run { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; color: var(--sec); font-size: .9rem; }
  .run select { flex: 1; min-width: 0; font: inherit; color: var(--testo); background: var(--carta); border: 1px solid var(--linea);
                border-radius: 10px; padding: 8px 10px; min-height: 40px; }
  small { color: var(--sec); display: block; margin-top: 14px; }
</style>
</head>
<body>
<main id="principale">
  <h1>Previsioni WRF · Lazio</h1>
  <label class="run" id="runbox" hidden>Run <select id="run" aria-label="Run del modello"></select></label>
  <div id="variabili" class="righe" role="group" aria-label="Tipo di mappa"></div>
  <div id="quadro" class="quadro"><img id="img" alt="" draggable="false"><div id="msg" class="msg">Carico…</div></div>
  <div class="comandi">
    <button id="indietro" aria-label="Ora precedente">◀</button>
    <button id="play" aria-label="Avvia">▶</button>
    <button id="avanti" aria-label="Ora successiva">▶|</button>
    <input id="cursore" type="range" min="0" max="0" value="0" aria-label="Ora della mappa">
  </div>
  <div class="ora"><span id="ora"></span><span id="passo"></span></div>
  <div class="scarica">
    <button id="scarica-img" type="button">⬇ Immagine</button>
    <button id="scarica-gif" type="button">⬇ GIF del run</button>
  </div>
  <div id="giorni" class="righe" role="group" aria-label="Giorno"></div>
  <small>Esperimento personale, non un servizio ufficiale: non sostituisce bollettini e allerte della Protezione Civile.</small>
</main>
<script>
"use strict";
// Dove il calcolo pubblica le immagini (ramo "risultati" del repository).
const BASE = "https://raw.githubusercontent.com/Superbug87/wrf-lazio/risultati/orarie/";
const FUSO = "Europe/Rome";

const el = id => document.getElementById(id);
const fmtOra = new Intl.DateTimeFormat("it-IT", { timeZone: FUSO, weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const fmtGiorno = new Intl.DateTimeFormat("it-IT", { timeZone: FUSO, weekday: "short", day: "numeric" });
const chiaveGiorno = new Intl.DateTimeFormat("sv-SE", { timeZone: FUSO });         // AAAA-MM-GG
const oraLocale = new Intl.DateTimeFormat("en-GB", { timeZone: FUSO, hour: "2-digit", hourCycle: "h23" });

let indice = null, variabile = null, k = 0, timer = null;
let cicli = [], sulUltimo = true;       // cicli disponibili (dal più recente) e se si sta guardando l'ultimo
const cache = new Map();

function salva(chiave, valore) { try { localStorage.setItem(chiave, valore); } catch (e) { /* facoltativo */ } }
function leggi(chiave) { try { return localStorage.getItem(chiave); } catch (e) { return null; } }

const url = (v, i) => `${BASE}${indice.ciclo}/${v}/${indice.ore[i].slice(0, 13).replace(/[-T]/g, "")}.png`;

function immagine(v, i) {                     // una sola Image per URL: serve da precaricamento
  const u = url(v, i);
  if (!cache.has(u)) { const im = new Image(); im.crossOrigin = "anonymous"; im.src = u; cache.set(u, im); }
  return cache.get(u);
}

function mostra(i) {
  k = Math.max(0, Math.min(indice.ore.length - 1, i));
  const im = immagine(variabile, k), img = el("img");
  el("msg").style.display = "none";
  img.onerror = () => { el("msg").textContent = "Immagine non disponibile (la previsione è in aggiornamento?). Riprova tra qualche minuto."; el("msg").style.display = "grid"; };
  img.src = im.src;
  const v = indice.variabili.find(x => x.id === variabile);
  img.alt = `${v.titolo}, ${fmtOra.format(new Date(indice.ore[k]))}`;
  el("cursore").value = k;
  el("ora").innerHTML = `<b>${fmtOra.format(new Date(indice.ore[k]))}</b>`;
  const h = indice.run ? Math.round((new Date(indice.ore[k]) - new Date(indice.run)) / 3.6e6) : null;
  el("passo").textContent = h === null ? "" : `+${h} h dal run`;
  document.querySelectorAll("#giorni button").forEach(b => b.classList.toggle("attivo", b.dataset.giorno === chiaveGiorno.format(new Date(indice.ore[k]))));
  for (let d = 1; d <= 3 && k + d < indice.ore.length; d++) immagine(variabile, k + d);   // le prossime, per non vedere il caricamento
}

function precarica() {                        // il resto della variabile, a poco a poco
  let i = 0;
  const passo = () => { if (i < indice.ore.length) { immagine(variabile, i++); setTimeout(passo, 120); } };
  passo();
}

function scegli(v) {
  variabile = v; salva("wrf_variabile", v);
  document.querySelectorAll("#variabili button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  mostra(k); precarica();
}

function stop() { if (timer) { clearInterval(timer); timer = null; } el("play").textContent = "▶"; el("play").setAttribute("aria-label", "Avvia"); }
function play() {
  if (timer) return stop();
  if (k >= indice.ore.length - 1) mostra(0);
  el("play").textContent = "❚❚"; el("play").setAttribute("aria-label", "Pausa");
  timer = setInterval(() => { if (k >= indice.ore.length - 1) return stop(); mostra(k + 1); }, 450);
}

function costruisci() {
  const vb = el("variabili"); vb.textContent = "";
  for (const v of indice.variabili) {
    const b = document.createElement("button");
    b.textContent = v.titolo; b.dataset.v = v.id; b.setAttribute("aria-pressed", "false");
    b.onclick = () => scegli(v.id);
    vb.appendChild(b);
  }
  const gb = el("giorni"); gb.textContent = "";
  const visti = new Map();
  indice.ore.forEach((t, i) => {
    const g = chiaveGiorno.format(new Date(t));
    const ore = Number(oraLocale.format(new Date(t)));
    const migliore = visti.get(g);
    if (!migliore || Math.abs(ore - 14) < Math.abs(migliore.ore - 14)) visti.set(g, { i, ore, t });   // l'ora più vicina alle 14
  });
  for (const [g, { i, t }] of visti) {
    const b = document.createElement("button");
    b.textContent = fmtGiorno.format(new Date(t)); b.dataset.giorno = g;
    b.onclick = () => { stop(); mostra(i); };
    gb.appendChild(b);
  }
  el("cursore").max = indice.ore.length - 1;
}

function oraPiuVicina(t0) {                   // l'ora della mappa più vicina a t0 (ms)
  let best = 0;
  indice.ore.forEach((t, i) => { if (Math.abs(new Date(t) - t0) < Math.abs(new Date(indice.ore[best]) - t0)) best = i; });
  return best;
}

const etichettaCiclo = c => {            // "2026101612" -> "ven 16 ott, 14:00 (12 UTC)"
  const d = new Date(Date.UTC(+c.slice(0, 4), +c.slice(4, 6) - 1, +c.slice(6, 8), +c.slice(8, 10)));
  return `${fmtOra.format(d)} (${c.slice(8, 10)} UTC)`;
};

async function leggiJson(percorso) {
  const r = await fetch(BASE + percorso, { cache: "no-cache" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function apri(ciclo, orario) {           // carica il ciclo e resta, se possibile, sulla stessa ora
  const nuovo = await leggiJson(ciclo ? `${ciclo}/indice.json` : "indice.json");
  indice = nuovo; cache.clear(); costruisci();
  const salvata = leggi("wrf_variabile");
  variabile = indice.variabili.some(v => v.id === (variabile || salvata)) ? (variabile || salvata) : indice.variabili[0].id;
  k = oraPiuVicina(orario);
  scegli(variabile);
}

function riempiRun() {
  const box = el("runbox"), sel = el("run");
  box.hidden = cicli.length < 2;               // con un solo ciclo il selettore non serve
  sel.textContent = "";
  cicli.forEach((c, i) => {
    const o = document.createElement("option");
    o.value = c; o.textContent = (i === 0 ? "ultimo · " : "") + etichettaCiclo(c);
    sel.appendChild(o);
  });
  if (indice) sel.value = indice.ciclo;
}

async function carica(primaVolta) {
  try {
    let elenco = [];
    try { elenco = (await leggiJson("cicli.json")).cicli || []; } catch (e) { /* vecchio formato: solo l'ultimo ciclo */ }
    const orario = indice ? new Date(indice.ore[k]).getTime() : Date.now();
    if (primaVolta) {
      cicli = elenco; await apri(elenco[0] || "", orario); riempiRun();
    } else if (elenco.length && elenco[0] !== cicli[0]) {                      // è uscito un nuovo ciclo
      cicli = elenco; riempiRun();
      if (sulUltimo) { await apri(cicli[0], orario); riempiRun(); }
    }
  } catch (e) {
    if (primaVolta) { el("msg").textContent = "Previsione non raggiungibile. Riprova tra qualche minuto."; el("msg").style.display = "grid"; }
  }
}

el("run").onchange = async e => {
  stop(); const c = e.target.value; sulUltimo = c === cicli[0];
  try { await apri(c, new Date(indice.ore[k]).getTime()); }
  catch (err) { el("msg").textContent = "Questo run non è più disponibile."; el("msg").style.display = "grid"; }
};
el("indietro").onclick = () => { stop(); mostra(k - 1); };
el("avanti").onclick = () => { stop(); mostra(k + 1); };
el("play").onclick = play;
el("cursore").oninput = e => { stop(); mostra(Number(e.target.value)); };
document.addEventListener("keydown", e => {
  if (!indice || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") { stop(); mostra(k - 1); }
  else if (e.key === "ArrowRight") { stop(); mostra(k + 1); }
  else if (e.key === " ") { e.preventDefault(); play(); }
});
let x0 = null;                                // scorrimento col dito sull'immagine
el("quadro").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
el("quadro").addEventListener("touchend", e => {
  if (x0 === null || !indice) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) { stop(); mostra(k + (dx < 0 ? 1 : -1)); }
}, { passive: true });


// ---------- Scarica l'immagine o l'intero run in GIF ----------
function salvaBlob(blob, nome) {
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
const nomeBase = i => `wrf-lazio_${variabile}_${indice.ciclo}_${indice.ore[i].slice(0, 13).replace(/[-T]/g, "")}`;

async function scaricaImmagine() {
  const b = el("scarica-img"), testo = b.textContent; b.disabled = true;
  try {
    const r = await fetch(url(variabile, k)); if (!r.ok) throw new Error(r.status);
    salvaBlob(await r.blob(), nomeBase(k) + ".png");
  } catch (e) { window.open(url(variabile, k), "_blank"); }      // se il browser non lascia scaricare, la apre
  b.disabled = false; b.textContent = testo;
}

// Encoder GIF minimale: un fotogramma = una tavolozza locale (le immagini hanno al massimo 128 colori).
function lzwGif(indici, minimo) {
  const clear = 1 << minimo, fine = clear + 1, out = [];
  let dim = minimo + 1, prossimo = fine + 1, acc = 0, nbit = 0, dict = new Map();
  const emetti = c => { acc |= c << nbit; nbit += dim; while (nbit >= 8) { out.push(acc & 255); acc >>>= 8; nbit -= 8; } };
  emetti(clear);
  let pre = indici[0];
  for (let i = 1; i < indici.length; i++) {
    const k2 = indici[i], chiave = (pre << 8) | k2, v = dict.get(chiave);
    if (v !== undefined) { pre = v; continue; }
    emetti(pre);
    if (prossimo < 4096) {
      dict.set(chiave, prossimo++);
      if (prossimo - 1 === (1 << dim) && dim < 12) dim++;
    } else { emetti(clear); dict = new Map(); dim = minimo + 1; prossimo = fine + 1; }
    pre = k2;
  }
  emetti(pre); emetti(fine);
  if (nbit > 0) out.push(acc & 255);
  return out;
}

function fotogramma(rgba, w, h, ritardoCs) {
  let mappa = new Map(), n = w * h, indici = new Uint8Array(n), colori = [], sh = 0;
  for (;;) {                                  // se i colori sono più di 256 si tolgono i bit meno importanti
    mappa = new Map(); colori = []; let troppi = false;
    for (let i = 0; i < n; i++) {
      const r = rgba[4 * i] >> sh << sh, g = rgba[4 * i + 1] >> sh << sh, b = rgba[4 * i + 2] >> sh << sh;
      const c = (r << 16) | (g << 8) | b; let ix = mappa.get(c);
      if (ix === undefined) { if (colori.length === 256) { troppi = true; break; } ix = colori.length; mappa.set(c, ix); colori.push(c); }
      indici[i] = ix;
    }
    if (!troppi) break; sh++;
  }
  let bits = 1; while ((1 << bits) < colori.length) bits++;
  const out = [0x21, 0xF9, 4, 0x04, ritardoCs & 255, ritardoCs >> 8, 0, 0,        // ritardo, il fotogramma resta com'è
               0x2C, 0, 0, 0, 0, w & 255, w >> 8, h & 255, h >> 8, 0x80 | (bits - 1)];
  for (let i = 0; i < (1 << bits); i++) { const c = colori[i] || 0; out.push(c >> 16 & 255, c >> 8 & 255, c & 255); }
  const minimo = Math.max(2, bits), dati = lzwGif(indici, minimo);
  out.push(minimo);
  for (let i = 0; i < dati.length; i += 255) { const blocco = dati.slice(i, i + 255); out.push(blocco.length, ...blocco); }
  out.push(0);
  return out;
}

async function scaricaGif() {
  const b = el("scarica-gif"), testo = b.textContent, tot = indice.ore.length; b.disabled = true; stop();
  try {
    const pezzi = [];
    const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
    let w = 0, h = 0;
    for (let i = 0; i < tot; i++) {
      b.textContent = `GIF ${i + 1}/${tot}…`;
      const im = immagine(variabile, i);
      if (!im.complete || !im.naturalWidth) await new Promise((ok, no) => { im.addEventListener("load", ok, { once: true }); im.addEventListener("error", () => no(new Error("immagine")), { once: true }); });
      if (i === 0) {
        w = im.naturalWidth; h = im.naturalHeight; cv.width = w; cv.height = h;
        pezzi.push(new Uint8Array([71, 73, 70, 56, 57, 97, w & 255, w >> 8, h & 255, h >> 8, 0, 0, 0,
          0x21, 0xFF, 11, 78, 69, 84, 83, 67, 65, 80, 69, 50, 46, 48, 3, 1, 0, 0, 0]));   // GIF89a, ripetizione continua
      }
      cx.drawImage(im, 0, 0);
      pezzi.push(new Uint8Array(fotogramma(cx.getImageData(0, 0, w, h).data, w, h, 200)));  // 200 centesimi = 2 secondi
      await new Promise(r => setTimeout(r, 0));                                              // lascia respirare la pagina
    }
    pezzi.push(new Uint8Array([0x3B]));
    salvaBlob(new Blob(pezzi, { type: "image/gif" }), `wrf-lazio_${variabile}_${indice.ciclo}.gif`);
  } catch (e) {
    el("msg").textContent = "Non riesco a creare la GIF (immagini non disponibili?). Riprova tra poco."; el("msg").style.display = "grid";
  }
  b.disabled = false; b.textContent = testo;
}
el("scarica-img").onclick = scaricaImmagine;
el("scarica-gif").onclick = scaricaGif;

// dentro Meteo Velletri (iframe): dice alla pagina quanto e' alta, così non restano spazi vuoti
if (window.parent !== window) {
  document.body.style.background = "transparent";          // prende lo sfondo della pagina che lo contiene
  const invia = () => window.parent.postMessage({ wrfAltezza: el("principale").offsetHeight }, location.origin);
  new ResizeObserver(invia).observe(el("principale")); window.addEventListener("load", invia);
}

carica(true);
setInterval(() => carica(false), 15 * 60 * 1000);
</script>
</body>
</html>
